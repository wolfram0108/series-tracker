[package]
name = "st-native"
version = "0.1.0"
edition = "2021"
description = "The one binding of the native core to the interpreter: handles on the data of the core, nothing else."

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
st-composition = { path = "../composition" }
st-contracts = { path = "../contracts" }
serde_json = "1"
