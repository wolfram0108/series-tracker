[package]
name = "st_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py312"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
caseless = "0.2"

[features]
# The module the interpreter loads; without it (`cargo test --no-default-features`) the tests link the interpreter.
default = ["extension"]
extension = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
debug = false
