# The native core of the recount of a series (docs/missions/rust-core): the data of the chain layout → plan → view lives
# here. One crate per owner of the data, in pure Rust with its own tests; `python` is the only binding to the interpreter.
[workspace]
resolver = "2"
members = ["contracts", "composition", "python"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
