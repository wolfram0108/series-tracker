[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The tests are independent (each has its own folder and database file): they run on every core. A worker that is free
# takes the tests another one has not begun (worksteal): a file of slow tests is not left to one worker.
# The acceptance in a browser (marker `ui`) runs apart, two browsers at most: a browser per core would not fit the box.
addopts = -n auto --dist worksteal -m "not ui"
markers =
    ui: the whole application in a browser (tests/ui_stand.py); run with `-m ui -n 2`
