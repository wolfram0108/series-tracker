[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The tests are independent (each has its own folder and database file): they run on six workers. A worker that is free
# takes the tests another one has not begun (worksteal): a file of slow tests is not left to one worker. The box of the
# service has 4 GB and runs the suite under a cap of 1300 MB: a worker holds ~130 MB, so eight of them (one a core) peaked at
# 1114 MB and a test that grew one for a moment crossed the cap; six peak at 937 MB and take ~10 % longer.
# The acceptance in a browser (marker `ui`) runs apart, two browsers at most: a browser per core would not fit the box.
addopts = -n 6 --dist worksteal -m "not ui"
markers =
    ui: the whole application in a browser (tests/ui_stand.py); run with `-m ui -n 2`
